EIO:CFG_1.0:6:1::
#
# VC-ONLY - NEVER LOAD ON A REAL CELL.
# Touch-sense P0 experiments (docs/abb_touch_sense_port_v1.md, D4).
#
# A World Zone box in TG_TouchProbe.mod drives doTG_SimTouch while the TCP
# is inside it; the cross connection copies it to diTG_SimTouched, which
# SearchL supervises. The sensor pair is the "sensor on -> sensor active"
# handshake a welder answers (Miller diWld1TouchActive), for a later
# SmarTac profile smtTG_Sim (X4/X5). All four are virtual signals (no
# device), so nothing here touches the Miller EtherNet/IP signals.
#
# Remove: RobotStudio -> Controller -> Configuration -> I/O System ->
# delete the four Signal and two Cross Connection instances named below,
# then restart the controller.
#
EIO_SIGNAL:

      -Name "doTG_SimTouch" -SignalType "DO" -Access "All"

      -Name "diTG_SimTouched" -SignalType "DI" -Access "All"

      -Name "doTG_SimSensorOn" -SignalType "DO" -Access "All"

      -Name "diTG_SimSensorActive" -SignalType "DI" -Access "All"
#
EIO_CROSS:

      -Name "TG_SimTouchCross" -Res "diTG_SimTouched" -Act1 "doTG_SimTouch"

      -Name "TG_SimSensorCross" -Res "diTG_SimSensorActive"\
      -Act1 "doTG_SimSensorOn"
