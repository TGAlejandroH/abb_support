MOC:CFG_1.0:6:0::
#
# MONARC station axis calibration - the four positioner ARM_TYPE records from the
# CUSTOMER controller backup (MonarchRS / Controller Data / 4600-803651_Virtual,
# SYSPAR/MOC.cfg). These carry the cell's per-axis rot_axis_pose calibration for
# STN1 (ARM1 tilt / PLATE1 rotate) and STN2 (ARM2 / PLATE2) - the values the MONARC
# URDF (build_urdf.py) was fitted against (residuals <= 4.2 mm, <= 0.27 deg).
#
# PURPOSE: load into a VC whose system carries only factory-template axis poses
# (rot_axis_pose zeros/defaults), which composes the coordinated station frame
# ~180 deg / ~2.1 m away from the cell truth (measured 2026-09-16, TGuideWeldingHMI
# docs/abb_coordinated_vc_test_log_v1.md sessions 7-8). Do NOT load the
# ProjectMonarch-lineage values: its ARM1 record duplicates the plate axis
# (tilt orient ~= plate orient) - a corrupt calibration.
#
# HOW: RobotStudio -> Controller -> Load Parameters -> this file ->
# "Load parameters and replace duplicates" -> restart (Warmstart).
#
ARM_TYPE:

      -name "ARM1" -independent_move_off  -attitude 1.5708\
      -rot_axis_pose_pos_x 1.40935 -rot_axis_pose_pos_y -0.061387\
      -rot_axis_pose_pos_z 0.659467 -rot_axis_pose_orient_u0 0.502568\
      -rot_axis_pose_orient_u1 -0.487831 -rot_axis_pose_orient_u2 -0.43362\
      -rot_axis_pose_orient_u3 0.566939 -mass 892 -mass_centre_x 0.345\
      -mass_centre_y 0.098 -mass_centre_z -0.005 -inertia_x 732 -inertia_y 768\
      -inertia_z 145 -max_inertia 2000 -transm_inertia 38.768 -max_acc 2.5\
      -max_acc_quota 0.7 -max_acc_quota_normal 0.7 -max_acc_quota_emstop 0.7\
      -rel_dist_torque_model_error 0.05

      -name "PLATE1" -length 0.882 -offset_y 0.25 -offset_z 0.964\
      -attitude 1.5708 -rot_axis_pose_pos_x 1.37036\
      -rot_axis_pose_pos_y 0.800883 -rot_axis_pose_pos_z 0.409268\
